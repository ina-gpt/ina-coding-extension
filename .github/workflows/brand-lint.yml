name: brand-lint

# Enforces BRANDING.md on every public surface in this repository.
# The rule used to exist only as human judgement; this is the half that runs.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  brand-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # brand-lint scans `git ls-files`; a shallow checkout still lists
          # every tracked path, but fetch-depth 1 keeps the job cheap.
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The negative proof runs FIRST and in the same job. A guard whose own
      # proof is not executed alongside it is a guard nobody has checked.
      - name: Negative proof (the gate must be able to fail)
        run: node --test tests/brand-lint.negative.test.mjs

      # The NDA-scoped provenance document must never become tracked in a
      # repository the public can read. GITHUB_TOKEN lets the guard ask GitHub
      # for the real visibility instead of inferring it.
      - name: provenance placement guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/brand-lint.mjs --provenance-guard

      - name: brand-lint
        id: lint
        shell: bash
        # pipefail is MANDATORY here: without it the pipeline reports `tee`'s
        # exit status and a repository full of violations ships green. GitHub's
        # bash step does not set it for you.
        run: |
          set -euo pipefail
          node scripts/brand-lint.mjs --json | tee brand-lint-report.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brand-lint-report
          path: brand-lint-report.json
          if-no-files-found: warn

  # The tree can be clean while the SHIPPED artifact is not: the .vsix carries a
  # webpack bundle generated at package time plus anything .vscodeignore failed
  # to exclude. Measured once at 92 raw hits across five files while brand-lint
  # reported the tree green. This job packages the extension and scans what a
  # customer would actually download.
  vsix-brand-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Artifact gate negative proof (it must be able to fail)
        run: node scripts/vsix-brand-scan.mjs --selftest

      - name: Install and build
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run compile

      - name: Package
        run: |
          set -euo pipefail
          # vsce resolves --out as a FILE path unless the directory already
          # exists: without this it fails with ENOTDIR. Passing an existing
          # directory locally is what hid this until CI ran it.
          mkdir -p ./artifact
          npx --yes @vscode/vsce package --out ./artifact/ --allow-missing-repository

      - name: Scan the packaged artifact
        run: |
          set -euo pipefail
          V="$(ls ./artifact/*.vsix)"
          node scripts/vsix-brand-scan.mjs --vsix="$V" --json | tee vsix-brand-report.json

      - name: Upload artifact report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vsix-brand-report
          path: vsix-brand-report.json
          if-no-files-found: warn
