name: secret-lint

# Credentials reached this host through a git remote URL and through assistant
# state files — neither is "source code", so a scanner that only reads tracked
# files would have reported clean the whole time. This job runs the same four
# channels CI can see.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The proof runs FIRST and in the same job: a gate whose own negative
      # proof is never executed is a gate nobody has checked.
      - name: Negative proof (the gate must be able to fail)
        run: node --test tests/secret-lint.negative.test.mjs

      - name: secret-lint
        shell: bash
        # pipefail is mandatory: without it the pipeline reports tee's status
        # and a repository full of credentials ships green.
        run: |
          set -euo pipefail
          node scripts/secret-lint.mjs --json | tee secret-lint-report.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-lint-report
          path: secret-lint-report.json
          if-no-files-found: warn
