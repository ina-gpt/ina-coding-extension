  <circle cx="118" cy="120" r="3" fill="#93c5fd" opacity="0.7"/>
  <circle cx="138" cy="120" r="3" fill="#93c5fd" opacity="0.7"/>
  <circle cx="128" cy="128" r="8" fill="url(#accent)" opacity="0.4"/>
